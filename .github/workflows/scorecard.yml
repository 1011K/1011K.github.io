name: OpenSSF Scorecard
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 3"
  workflow_dispatch:
permissions: read-all
jobs:
  analysis:
    name: Supply-chain posture (scorecard)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-report
          path: scorecard.sarif
          retention-days: 30
      - uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
